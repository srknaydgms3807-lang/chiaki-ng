# PS5 Türkçe Altyazı – Android APK derlemesi
# Çalıştırmak için: GitHub'da Actions sekmesi -> "Android APK (Türkçe)" -> "Run workflow".
# Bitince sayfanın altındaki "PS5-Turkce-APK" dosyasını indirip telefona kurun.
name: Android APK (Türkçe)

on:
  workflow_dispatch:
  push:
    branches: [ "turkce-altyazi" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Derleme araçları
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          python3 -m pip install --user protobuf grpcio-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Turkce-APK
          path: android/app/build/outputs/apk/debug/*.apk

      # Telefondan kolay indirme: APK'yı "Releases" sayfasına koy (her derlemede güncellenir)
      - name: Sürüm sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/*.apk PS5-Turkce.apk
          gh release delete turkce-son --yes --cleanup-tag || true
          gh release create turkce-son PS5-Turkce.apk \
            --target "${{ github.sha }}" \
            --title "PS5 Türkçe (son sürüm)" \
            --notes "Telefondan PS5-Turkce.apk dosyasına dokunup indirin ve kurun."
